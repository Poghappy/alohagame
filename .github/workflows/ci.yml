name: CI/CD Pipeline

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bytebot_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        npm ci
        cd packages/bytebot-agent && npm ci
        cd ../bytebot-ui && npm ci
        cd ../bytebotd && npm ci
    
    - name: Run linting
      run: |
        npm run lint
    
    - name: Run type checking
      run: |
        cd packages/bytebot-agent && npm run build
        cd ../bytebot-ui && npm run build
        cd ../bytebotd && npm run build
    
    - name: Run tests
      run: |
        npm run test
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bytebot_test
        NODE_ENV: test

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      if: github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Agent image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./packages/bytebot-agent/Dockerfile
        push: ${{ github.ref == 'refs/heads/main' }}
        tags: |
          bytebotai/bytebot-agent:latest
          bytebotai/bytebot-agent:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push UI image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./packages/bytebot-ui/Dockerfile
        push: ${{ github.ref == 'refs/heads/main' }}
        tags: |
          bytebotai/bytebot-ui:latest
          bytebotai/bytebot-ui:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push Desktop image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/bytebot-desktop.Dockerfile
        push: ${{ github.ref == 'refs/heads/main' }}
        tags: |
          bytebotai/bytebot-desktop:latest
          bytebotai/bytebot-desktop:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/development'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add your staging deployment commands here
        # Example: kubectl apply -f k8s/staging/
    
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build, security]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        # Add your production deployment commands here
        # Example: kubectl apply -f k8s/production/